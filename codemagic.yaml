workflows:
  ios-unsigned-build:
    name: iOS Unsigned Build
    max_build_duration: 120
    instance_type: mac_mini_m2
    environment:
      xcode: 26.4
      cocoapods: default
      vars:
        PROJECT_PATH: "Examples/SwiftHorizonSDKDemo/SwiftHorizonSDKDemo.xcodeproj"
        SRC_DIR: "Examples/SwiftHorizonSDKDemo/SwiftHorizonSDKDemo"
    cache:
      cache_paths:
        - ~/Library/Developer/Xcode/DerivedData

    scripts:
      # Step 1: Diagnose
      - name: Diagnose environment
        script: |
          set -uo pipefail
          echo "=== Xcode & SDK ==="
          xcodebuild -version || true
          xcrun --sdk iphoneos --show-sdk-version || true
          echo ""
          echo "=== Project structure ==="
          ls -la "$SRC_DIR" || echo "❌ SRC tidak ditemukan"
          ls -la "$PROJECT_PATH" || echo "❌ PROJECT tidak ditemukan"

      # Step 2: Diagnose schemes
      - name: Diagnose schemes and targets
        script: |
          set -uo pipefail
          xcodebuild -project "$PROJECT_PATH" -list || true

      # Step 3: Rewrite AppDelegate.swift completely (safest approach)
      - name: Rewrite AppDelegate.swift
        script: |
          set -euo pipefail
          APPD="$SRC_DIR/AppDelegate.swift"
          
          cat > "$APPD" <<'EOF'
          //
          //  AppDelegate.swift
          //  HorizonSDKSwiftSample
          //
          //  Created by Stelios Petrakis on 2/25/15.
          //  Copyright (c) 2015 Horizon Video Technologies. All rights reserved.
          //

          import UIKit

          @UIApplicationMain
          class AppDelegate: UIResponder, UIApplicationDelegate {

              var window: UIWindow?

              func application(_ application: UIApplication,
                               didFinishLaunchingWithOptions launchOptions: [UIApplication.LaunchOptionsKey : Any]? = nil) -> Bool {
                  return true
              }

              func applicationWillResignActive(_ application: UIApplication) {
              }

              func applicationDidEnterBackground(_ application: UIApplication) {
              }

              func applicationWillEnterForeground(_ application: UIApplication) {
              }

              func applicationDidBecomeActive(_ application: UIApplication) {
              }

              func applicationWillTerminate(_ application: UIApplication) {
              }
          }
          EOF
          
          echo "✅ AppDelegate.swift berhasil ditulis ulang"
          echo "=== Verifikasi ==="
          cat "$APPD"

      # Step 4: Auto-migrate API in all other swift files (not AppDelegate which is already clean)
      - name: Auto-migrate deprecated Swift APIs
        script: |
          set -euo pipefail
          for f in $(find "$SRC_DIR" -type f -name "*.swift" ! -name "AppDelegate.swift"); do
            perl -pi -e 's/\bUIApplicationLaunchOptionsKey\b/UIApplication.LaunchOptionsKey/g' "$f"
            perl -pi -e 's/\bUIApplicationOpenURLOptionsKey\b/UIApplication.OpenURLOptionsKey/g' "$f"
            perl -pi -e 's/\bAVMediaTypeVideo\b/AVMediaType.video/g' "$f"
            perl -pi -e 's/\bAVMediaTypeAudio\b/AVMediaType.audio/g' "$f"
          done
          echo "✅ Auto-migrate selesai"

      # Step 5: Detect scheme
      - name: Detect build scheme
        script: |
          set -euo pipefail
          SCHEME=$(xcodebuild -project "$PROJECT_PATH" -list 2>/dev/null \
            | awk '/Schemes:/{flag=1; next} /^$/{flag=0} flag' \
            | sed 's/^[[:space:]]*//' \
            | grep -v '^$' \
            | head -1)
          
          mkdir -p "$CM_BUILD_DIR/.build_meta"
          if [ -n "$SCHEME" ]; then
            echo "MODE=scheme" > "$CM_BUILD_DIR/.build_meta/detect.env"
            echo "SCHEME=$SCHEME" >> "$CM_BUILD_DIR/.build_meta/detect.env"
          else
            echo "MODE=target" > "$CM_BUILD_DIR/.build_meta/detect.env"
            echo "SCHEME=HorizonSDK-Swift" >> "$CM_BUILD_DIR/.build_meta/detect.env"
          fi
          cat "$CM_BUILD_DIR/.build_meta/detect.env"

      # Step 6: Build unsigned
      - name: Build unsigned .app
        script: |
          set -euo pipefail
          source "$CM_BUILD_DIR/.build_meta/detect.env"
          
          COMMON_ARGS=(
            -project "$PROJECT_PATH"
            -configuration Release
            -derivedDataPath build
            CODE_SIGN_IDENTITY=""
            CODE_SIGNING_REQUIRED=NO
            CODE_SIGNING_ALLOWED=NO
            CODE_SIGNING_ENTITLEMENTS=""
            SWIFT_VERSION=5.0
            IPHONEOS_DEPLOYMENT_TARGET=15.0
            ONLY_ACTIVE_ARCH=NO
            ENABLE_BITCODE=NO
            DEBUG_INFORMATION_FORMAT=dwarf
            FRAMEWORK_SEARCH_PATHS="$(pwd)/HorizonSDK $(pwd)/Examples/SwiftHorizonSDKDemo/SwiftHorizonSDKDemo"
          )
          
          if [ "$MODE" = "scheme" ]; then
            xcodebuild build "${COMMON_ARGS[@]}" -scheme "$SCHEME" -destination 'generic/platform=iOS'
          else
            xcodebuild build \
              -project "$PROJECT_PATH" \
              -target "$SCHEME" \
              -configuration Release \
              -sdk iphoneos \
              SYMROOT="$(pwd)/build" \
              CODE_SIGN_IDENTITY="" \
              CODE_SIGNING_REQUIRED=NO \
              CODE_SIGNING_ALLOWED=NO \
              CODE_SIGNING_ENTITLEMENTS="" \
              SWIFT_VERSION=5.0 \
              IPHONEOS_DEPLOYMENT_TARGET=15.0 \
              ONLY_ACTIVE_ARCH=NO \
              ENABLE_BITCODE=NO \
              DEBUG_INFORMATION_FORMAT=dwarf \
              FRAMEWORK_SEARCH_PATHS="$(pwd)/HorizonSDK $(pwd)/Examples/SwiftHorizonSDKDemo/SwiftHorizonSDKDemo"
          fi

      # Step 7: Clean signature
      - name: Verify and clean signature
        script: |
          set -euo pipefail
          APP_PATH=$(find build/Build/Products -name "*.app" -maxdepth 4 -type d 2>/dev/null | head -1)
          if [ -z "$APP_PATH" ]; then
            echo "❌ .app tidak ditemukan"
            find build -type d | head -20 || true
            exit 1
          fi
          echo "✅ App: $APP_PATH"
          
          rm -rf "$APP_PATH/_CodeSignature"
          rm -f "$APP_PATH/embedded.mobileprovision"
          if [ -d "$APP_PATH/Frameworks" ]; then
            find "$APP_PATH/Frameworks" -name "_CodeSignature" -type d -exec rm -rf {} + 2>/dev/null || true
          fi
          echo "✅ Signature dibersihkan"

      # Step 8: Package IPA
      - name: Package unsigned IPA
        script: |
          set -euo pipefail
          APP_PATH=$(find build/Build/Products -name "*.app" -maxdepth 4 -type d 2>/dev/null | head -1)
          APP_NAME=$(basename "$APP_PATH" .app)
          IPA_NAME="${APP_NAME}-unsigned.ipa"
          
          rm -rf Payload
          mkdir -p Payload
          cp -R "$APP_PATH" Payload/
          
          find Payload -name "_CodeSignature" -type d -exec rm -rf {} + 2>/dev/null || true
          find Payload -name "embedded.mobileprovision" -type f -delete 2>/dev/null || true
          
          zip -rq "$IPA_NAME" Payload
          echo "✅ IPA: $IPA_NAME"
          ls -la "$IPA_NAME"

    artifacts:
      - "*.ipa"
      - /tmp/xcodebuild_logs/*.log
